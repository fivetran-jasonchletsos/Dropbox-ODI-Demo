version: 2

models:
  - name: metricflow_time_spine
    description: |
      Daily time spine for the dbt semantic layer. Required by every
      semantic_model that defines a time dimension at day granularity.
    config:
      materialized: table
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
